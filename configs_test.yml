Operation:
    #Name
    Prefix: 'WRN34_200_LFCM'
    #Train Method [AT, Natural]
    Method: 'LFCM'
    #Backbone network trunk [WRN34, ResNet18, ResNet50] (must match training, default WRN34)
    #Method->variant mapping: Natural/AT/HFDR -> *_F (HFDR variant); LFCM -> *_LFCM
    Backbone: 'WRN34'
    #Proposed Method Edit Prefix
    Addtional_string: ''
    Record_string: ''
    #Validate Best
    Validate_Best: True
    #Validate Last
    Validate_Last: True
    #Test attack Choosing
    Validate_Natural: True
    Validate_PGD: True
    Validate_CW: True
    Validate_Autoattack: True
    # WandB logging (optional, safe fallback if disabled or unavailable)
    Use_WandB: True
    WandB_Project: "LFCM"
    WandB_Entity: ""
    WandB_Group: "LFCM"
    WandB_RunName: "WRN34_200_LFCM"
    WandB_Tags: ["TinyImageNet","LFCM"]
    WandB_Mode: "online"
DATA:
    #Data
    Data: 'TinyImageNet'
    #Num class
    num_class: 200
    # Dataset mean and std used for data normalization
    mean: !!python/tuple [0.4914, 0.4822, 0.4465]
    std: !!python/tuple [0.2471, 0.2435, 0.2616]
ADV:
    # FGSM parameters during training
    clip_eps: 8
    fgsm_step: 2
    # PGD attack parameters used during validation
    # the same clip_eps as above is used for PGD
    pgd_test:
    - !!python/tuple [20, 8, 2]
    - !!python/tuple [100, 8, 2]

# ============================================================
# LFCM Architecture (must match training configs_train.yml)
# Only used when Operation.Method == "LFCM"
# ============================================================
LFCM:
    codebook_size: 64        # K: number of canonical codes (must match checkpoint)
    code_dim: 32             # d: code vector dimension
    hidden_dim: 64           # MLP hidden dimension
